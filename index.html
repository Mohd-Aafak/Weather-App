
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="app-container">

        <h1 class="app-title">Weather App <span>🌦️</span></h1>

        <div class="search-box">
            <input
                type="text"
                id="city-input"
                placeholder="Enter city name..."
                aria-label="Enter city name"
            >
            <button id="search-btn">Search</button>
        </div>

        <div id="weather-result" class="weather-card">
            <div class="weather-icon" id="weather-icon">🌤️</div>

            <h2 id="city-name">Search a city</h2>
            <p id="condition">Your weather starts here</p>
            <h1 id="temperature">--°C</h1>

            <div class="weather-details">
                <div class="detail-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail-box">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="wind-speed">-- km/h</h3>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
